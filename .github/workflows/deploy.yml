name: Deploy to Azure Container Apps

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]      # lint and test every PR into main before it merges
  workflow_dispatch:        # lets you trigger a deploy manually from the Actions tab

env:
  IMAGE: ${{ secrets.REGISTRY }}/trading-simms:${{ github.sha }}
  APP_NAME: trading-simms
  RESOURCE_GROUP: trading-simms-rg

jobs:
  # Run the test suite first; if any test fails, the deploy job never starts
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Same Python minor version as the Dockerfile's base image (3.13.3)
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Runtime pins plus pytest, httpx and ruff; the image installs requirements.txt only
      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # Lint before the tests: a style or import-order regression fails the
      # build fast, before the slower test run. Config lives in pyproject.toml.
      - name: Lint with ruff
        run: python -m ruff check .

      # "python -m pytest" (not bare "pytest") puts the repo root on the
      # import path so tests can import main, routes, services and schemas
      - name: Run tests
        run: python -m pytest -v

  deploy:
    needs: test
    # Build and ship only on a push to main (or a manual dispatch). A
    # pull_request run stops at the test job: it validates, never deploys.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Log Docker into your Azure Container Registry using the admin creds
      - name: Log in to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      # Build the image ON the GitHub runner (NOT ACR Tasks, which the
      # student subscription blocks) and push it, tagged with the commit SHA
      - name: Build and push image
        run: |
          docker build -t $IMAGE .
          docker push $IMAGE

      # Authenticate the Azure CLI with the service principal
      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Point the existing container app at the new image
      - name: Update container app
        run: |
          az containerapp update \
            --name $APP_NAME \
            --resource-group $RESOURCE_GROUP \
            --image $IMAGE
